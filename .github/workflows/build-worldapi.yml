name: Build AwesomeWotlk WorldAPI
# Builds the vendored awesome_wotlk/ tree on THIS branch only. The 3.3.5a client
# (build 12340) is 32-bit, hence Win32/x86. Base: noname08662/awesome_wotlk @ v37
# (the release line the maintainer actually runs), plus the WorldAPI module.
# Build shape mirrors upstream's own windows-release.yml (VS 2022, Win32,
# host=x64 toolchain); the artifact packages the same runtime set upstream
# ships: the DLL, the patcher, and deps/skia/skia.dll (a runtime dependency of
# the MSDF font rendering -- the DLL does not load without it).
on:
  push:
    branches: ["awesome-wotlk-worldapi"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Configure (MSVC, Win32)
        # No -G pin: upstream pins "Visual Studio 17 2022" but windows-latest
        # now ships VS 18, and a pinned generator that is not installed fails
        # in seconds. The default generator picks whatever VS the image has.
        run: cmake -S awesome_wotlk -B out -A Win32 -T host=x64
      - name: Build Release
        run: cmake --build out --config Release -- /m
      - name: Stage runtime set
        shell: bash
        run: |
          mkdir staging
          # noname's CMake emits into awesome_wotlk/build/<config>, not the
          # cmake -B dir -- search both, and FAIL if the DLL is missing (a
          # silent find match miss shipped an artifact containing only skia)
          find out awesome_wotlk/build -name 'AwesomeWotlkLib.dll' -exec cp {} staging/ \;
          find out awesome_wotlk/build -name 'AwesomeWotlkPatch.exe' -exec cp {} staging/ \;
          test -f staging/AwesomeWotlkLib.dll
          cp awesome_wotlk/deps/skia/skia.dll staging/
          ls -la staging
      - uses: actions/upload-artifact@v4
        with:
          name: AwesomeWotlk-worldapi-${{ github.sha }}
          path: staging/*
          retention-days: 14
      - name: Publish binaries to a git branch (fetchable where artifact storage is not)
        shell: bash
        run: |
          cd staging
          git init -q -b worldapi-binaries
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -qm "WorldAPI build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" worldapi-binaries
