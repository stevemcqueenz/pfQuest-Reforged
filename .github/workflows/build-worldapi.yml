name: Build AwesomeWotlk WorldAPI
# Builds the vendored awesome_wotlk/ tree on THIS branch only. The 3.3.5a client
# (build 12340) is 32-bit, hence Win32/x86. This branch exists as temporary
# hosting: the session that produced it cannot create repos/forks, so the DLL
# flavor lives here until a proper fork of FrostAtom/awesome_wotlk exists.
on:
  push:
    branches: ["awesome-wotlk-worldapi"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC, Win32)
        run: cmake -B out -S awesome_wotlk -A Win32
      - name: Build Release
        run: cmake --build out --config Release
      - name: List binaries
        shell: bash
        run: find awesome_wotlk/build out -name '*.dll' -o -name '*.exe' | sort || true
      - uses: actions/upload-artifact@v4
        with:
          name: AwesomeWotlk-worldapi-${{ github.sha }}
          path: |
            awesome_wotlk/build/**/*.dll
            awesome_wotlk/build/**/*.exe
            out/**/Release/*.dll
            out/**/Release/*.exe
          retention-days: 14
